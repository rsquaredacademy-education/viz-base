project:
  type: book
  output-dir: docs
  resources:
    - "google02e424888b5e2def.html"
    - "robots.txt"
    - "sitemap.xml"

quarto-required: ">=1.6.0"

sitemap: true

website:
  site-url: https://viz-base.rsquaredacademy.com
  description: "Learn to visualize data with base R: zero-dependency, publication-ready graphics."
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/rsquaredacademy-education/viz-base
  navbar:
    right:
      - text: "GitHub"
        href: https://github.com/rsquaredacademy-education/viz-base
  # google-analytics: "G-XXXXXXXXXX" # TODO: add GA4 ID when available (+ consent banner)

book:
  title: "Data Visualization with R"
  subtitle: "Base Graphics"
  author: "Aravind Hebbali"
  date: last-modified
  chapters:
    - index.qmd
    - why-base.qmd
    - intro.qmd
    - titlelabels.qmd
    - scatter.qmd
    - line.qmd
    - bar.qmd
    - box.qmd
    - hist.qmd
    - legend.qmd
    - textann.qmd
    - facet.qmd
    - export-devices.qmd
    - about-the-author.qmd
  downloads: [pdf, epub]
  appendices:
    - rosetta.qmd

execute:
  freeze: auto
  warning: false

format:
  html:
    # Interactive R cells (Ch 1-3 only) via WebAssembly; base R needs no downloads.
    # Scoped to HTML: the webr lua filter rewrites the AST and breaks the
    # Typst template's #callout definition for PDF output (same call as
    # viz-ggplot2 and data-wrangling).
    filters:
      - webr
    theme:
      light: flatly
      dark: darkly
    toc-depth: 3
    search: true
    code-tools: true
    code-copy: true
    code-overflow: wrap
    fig-align: center
    fig-dpi: 192
    include-in-header: includes/head.html
  pdf:
    pdf-engine: typst
    papersize: us-letter
    toc-depth: 3
    code-overflow: wrap
    # Explicit so the PDF resolves the same on the bare CI runner as it does
    # locally. Typst ships no fonts and the runner's fontconfig cache can be
    # stale, which fails the render with "font fallback list must not be
    # empty". Both are provided by fonts-linuxlibertine / fonts-dejavu-core.
    mainfont: "Linux Libertine"
    monofont: "DejaVu Sans Mono"
    # PNG figures: Typst < 0.12 cannot embed PDF images, and this also
    # sidesteps external pdfcrop tooling entirely. 300 dpi stays print-crisp.
    fig-format: png
    fig-dpi: 300
  epub:
    toc-depth: 2
    epub-chapter-level: 1
    cover-image: img/viz-base.png
    code-overflow: wrap

language:
  search:
    placeholder: "Search arguments, e.g. pch vs cex"
