project:
  type: book
  output-dir: docs

# Interactive R cells (Ch 1-3 only) via WebAssembly; base R needs no downloads.
filters:
  - webr

quarto-required: ">=1.6.0"

sitemap: true

website:
  site-url: https://viz-base.rsquaredacademy.com
  description: "Learn to visualize data with base R: zero-dependency, publication-ready graphics."
  open-graph: true
  twitter-card: true
  # google-analytics: "G-XXXXXXXXXX" # TODO: add GA4 ID when available (+ consent banner)

book:
  title: "Data Visualization with R"
  subtitle: "Base Graphics"
  author: "Aravind Hebbali"
  date: last-modified
  chapters:
    - index.qmd
    - intro.qmd
    - titlelabels.qmd
    - scatter.qmd
    - line.qmd
    - bar.qmd
    - box.qmd
    - hist.qmd
    - legend.qmd
    - textann.qmd
    - facet.qmd
    - about-the-author.qmd
  downloads: [pdf, epub]

execute:
  freeze: auto

format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc-depth: 3
    code-tools: true
    code-copy: true
    code-overflow: wrap
    include-in-header: includes/head.html
  pdf:
    pdf-engine: typst
    toc-depth: 3
    code-overflow: wrap
    # PNG figures: Typst < 0.12 cannot embed PDF images, and this also
    # sidesteps external pdfcrop tooling entirely. 300 dpi stays print-crisp.
    fig-format: png
    fig-dpi: 300
  epub:
    toc-depth: 2
    code-overflow: wrap
