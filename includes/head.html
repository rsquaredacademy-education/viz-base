<!-- Head metadata for every page.

     Three distinct mechanisms are at work here:

     1. The description and Open Graph / Twitter tags below are PLACEHOLDERS.
        Quarto rewrites description, og:title, og:description, og:image and the
        twitter:* values per page (see `open-graph` / `twitter-card` in
        _quarto.yml), so the literal values here never reach the reader. Do not
        delete these tags -- with them removed Quarto emits nothing. Verified:
        docs/scatter.html gets "4 Scatter Plots", docs/line.html gets
        "5 Line Graphs". og:site_name and og:type are ours; Quarto does not
        manage those.

        The plain `description` tag matters as much as the og: ones: it is the
        text Google shows in a search result, and it was missing from every page
        until each chapter got `description:` front matter. Keep the placeholder
        -- without it Quarto emits no description tag at all, which is the
        original bug.

     2. The citation_* tags are hand-written because Quarto has no native
        Highwire/Scholar support. This is the reason this file exists.

     Deliberately NOT here: the canonical link and og:url. Quarto emits
     neither for `type: book`, and hard-coding them made every one of the 12
     pages claim the site root as its canonical URL -- which tells search
     engines the whole book is a single page. An absent canonical is merely
     neutral; a wrong one is destructive. sitemap.xml carries the real
     per-page URLs. See roadmap: Phase 3 SEO pass.

     TODO(analytics): set google-analytics in _quarto.yml once the GA4 ID exists,
     and add a consent banner alongside it (no cookies are set until then). -->
<meta property="og:site_name" content="Data Visualization with R">
<meta property="og:type" content="book">
<meta name="description" content="Learn to visualize data with base R: zero-dependency, publication-ready graphics.">
<meta property="og:title" content="Data Visualization with R — Base Graphics">
<meta property="og:description" content="Learn to visualize data with base R: zero-dependency, publication-ready graphics.">
<meta property="og:image" content="https://viz-base.rsquaredacademy.com/img/viz-base.png">
