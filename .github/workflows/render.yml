name: Build & Deploy to GitHub Pages (docs/)

on:
  push:
    branches: [master]
    # `date: last-modified` re-stamps every page on each run, so the bot's own
    # docs/ commit would otherwise retrigger this workflow forever.
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Typst ships no fonts; the bare runner has none either, so the PDF dies
      # with "font fallback list must not be empty". poppler-utils provides
      # pdfinfo, used to assert the cheatsheet is still exactly one page.
      - name: Install fonts and pdfinfo
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-linuxlibertine fonts-dejavu-core poppler-utils
          fc-cache -f

      # Pinned to the toolchain verified locally for this book. Unpinned
      # "release" (1.10.18) + latest typst fails the PDF inside Quarto's own
      # Typst template: rgb(content-to-string(linkcolor)) -> "color string
      # contains non-hexadecimal letters". Bump both together, never one.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          version: "0.11.0"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e "install.packages(c('knitr', 'rmarkdown'), Ncpus = 4)"

      - name: WebR static smoke (<30s)
        run: Rscript scripts/webr-smoke.R

      - name: Render HTML
        run: quarto render --to html --output-dir /tmp/stage-html

      # Generated, not hand-maintained. The hand-maintained copy this replaced had
      # drifted out of order against _quarto.yml and had dropped privacy.html
      # entirely. Generating it here means it cannot drift.
      - name: Generate sitemap
        run: bash scripts/make-sitemap.sh /tmp/stage-html https://viz-base.rsquaredacademy.com

      # PDF/EPUB are required, not advisory: the roadmap's Phase 1 DoD is
      # "PDF + EPUB build clean in CI", and `downloads: [pdf, epub]` is
      # advertised on the landing page. A silent non-fatal render previously
      # shipped a green build with no PDF at all.
      - name: Render PDF
        run: quarto render --to pdf --output-dir /tmp/stage-pdf

      - name: Render ePub
        run: quarto render --to epub --output-dir /tmp/stage-epub

      # Standalone Typst artifact, linked from export-devices.html. Not a
      # Quarto chapter: it must stay exactly one page and must not run R.
      # Uses the same typst + Linux Libertine already set up above, so it adds
      # no toolchain. The page-count assertion is the whole point of the check
      # -- a "cheatsheet" that silently grows to two pages stops being one.
      - name: Build cheatsheet
        run: |
          typst compile cheatsheet/base-par-cheatsheet.typ /tmp/base-par-cheatsheet.pdf
          test -f /tmp/base-par-cheatsheet.pdf || { echo "CHEATSHEET MISSING"; exit 1; }
          pages=$(pdfinfo /tmp/base-par-cheatsheet.pdf | awk '/^Pages:/ {print $2}')
          echo "cheatsheet pages: $pages"
          test "$pages" = "1" || { echo "CHEATSHEET MUST BE 1 PAGE, got $pages"; exit 1; }

      # Slug list is derived from _quarto.yml, not hand-maintained. references.html
      # is a legacy bookdown URL that went missing during the Quarto migration and
      # came back only by luck; a derived list cannot rot the same way.
      - name: Verify slugs rendered
        run: sh scripts/verify-slugs.sh /tmp/stage-html

      # Set comparison, not a count. The old hand-maintained sitemap had 17
      # entries for 17 pages while omitting privacy.html, because a bare "/"
      # root entry offset the missing one -- a count-based gate passes that.
      - name: Verify sitemap covers every page
        run: sh scripts/verify-sitemap.sh /tmp/stage-html /tmp/stage-html/sitemap.xml

      - name: Verify no unresolved cross-references
        run: |
          if grep -r '??</strong>' /tmp/stage-html/*.html; then
            echo "FAIL: unresolved cross-references (??) found"; exit 1
          fi
          echo "OK: no unresolved cross-references"

      - name: Verify downloads are present
        run: |
          ls /tmp/stage-pdf/*.pdf || { echo "PDF MISSING"; exit 1; }
          ls /tmp/stage-epub/*.epub || { echo "EPUB MISSING"; exit 1; }

      - name: Assemble docs
        run: |
          rm -rf docs && mkdir -p docs
          cp -r /tmp/stage-html/. docs/
          cp /tmp/stage-pdf/*.pdf docs/
          cp /tmp/stage-epub/*.epub docs/
          cp /tmp/base-par-cheatsheet.pdf docs/
          cp robots.txt google02e424888b5e2def.html privacy.html 404.html docs/ 2>/dev/null || true
          rm -rf docs/docs
          test -f docs/sitemap.xml || { echo "sitemap.xml missing after assemble"; exit 1; }
          ls docs/*.pdf docs/*.epub

      # Analytics has to stay opt-in, and that is easy to break silently: adding
      # `website.google-analytics` to _quarto.yml would load Google for everyone.
      # So assert the negative -- a *static* gtag script tag in any page means
      # Google is contacted before anyone clicks accept, which is the exact
      # failure the hand-rolled gate in includes/analytics.html exists to prevent.
      - name: Verify analytics stays consent-gated
        run: |
          test -f docs/privacy.html || { echo "privacy.html MISSING from docs/"; exit 1; }
          if grep -rqE '<script[^>]+src="https://www\.googletagmanager\.com' docs/*.html; then
            echo "UNCONDITIONAL ANALYTICS: gtag script tag present without consent"; exit 1;
          fi
          grep -q 'qz-consent' docs/index.html || { echo "consent banner missing"; exit 1; }
          grep -q 'G-P98W8WC0XC' docs/index.html || { echo "measurement ID missing"; exit 1; }
          echo "analytics OK: consent-gated, no static gtag tag"

      - name: Link check (advisory)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: "docs/**/*.html --root-dir docs --exclude 'mailto:*'"

      - name: Commit docs
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: rebuild site via ci"
          file_pattern: docs/