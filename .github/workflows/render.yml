name: Build & Deploy to GitHub Pages (docs/)

on:
  push:
    branches: [master]
    # `date: last-modified` re-stamps every page on each run, so the bot's own
    # docs/ commit would otherwise retrigger this workflow forever.
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "release"

      - name: Install Typst (PDF engine)
        run: quarto install tool typst --no-prompt

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e "install.packages(c('knitr', 'rmarkdown'), Ncpus = 4)"

      - name: WebR static smoke (<30s)
        run: Rscript scripts/webr-smoke.R

      - name: Render HTML
        run: quarto render --to html --output-dir /tmp/stage-html

      - name: Install static sitemap (Quarto reserves the path)
        run: cp sitemap.xml /tmp/stage-html/sitemap.xml

      # PDF/EPUB are non-fatal: a book download breaking must not block the
      # HTML site from shipping.
      - name: Render PDF
        run: quarto render --to pdf --output-dir /tmp/stage-pdf || echo "PDF_FAILED=1" >> $GITHUB_ENV

      - name: Render ePub
        run: quarto render --to epub --output-dir /tmp/stage-epub || echo "EPUB_FAILED=1" >> $GITHUB_ENV

      - name: Verify legacy slugs
        run: |
          for f in index intro titlelabels scatter line bar box hist legend textann facet about-the-author; do
            test -f "/tmp/stage-html/$f.html" || { echo "MISSING SLUG: /tmp/stage-html/$f.html"; exit 1; }
          done
          test -f /tmp/stage-html/sitemap.xml || { echo "sitemap.xml missing from staged output"; exit 1; }

      - name: Assemble docs
        run: |
          rm -rf docs && mkdir -p docs
          cp -r /tmp/stage-html/. docs/
          cp /tmp/stage-pdf/*.pdf docs/ 2>/dev/null || echo "No PDF staged (PDF_FAILED=${PDF_FAILED:-0})"
          cp /tmp/stage-epub/*.epub docs/ 2>/dev/null || echo "No ePub staged (EPUB_FAILED=${EPUB_FAILED:-0})"
          cp robots.txt sitemap.xml google02e424888b5e2def.html 404.html docs/ 2>/dev/null || true
          rm -rf docs/docs
          test -f docs/sitemap.xml || { echo "sitemap.xml missing after assemble"; exit 1; }
          ls docs/

      - name: Link check (advisory)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: "docs/**/*.html --root-dir docs --exclude 'mailto:*'"

      - name: Commit docs
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: rebuild site via ci"
          file_pattern: docs/